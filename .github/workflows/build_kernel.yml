name: Build Kernel for Xiaomi 11 Ultra (Star)

on:
  workflow_dispatch: # 允许手动点击按钮触发编译
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-22.04 # 明确指定 22.04，比 latest 更稳定，且支持我们需要的库

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4 # 升级到 v4
        with:
          submodules: recursive 

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          # 更新依赖包，移除 ubuntu 22.04+ 已废弃的 lib32ncurses5-dev 等，改用兼容包
          sudo apt-get install -y git ccache automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            python3 python3-pip libxml2-utils bzip2 libbz2-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make \
            optipng maven libssl-dev pwgen libswitch-perl policycoreutils \
            minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 \
            libncurses-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
            device-tree-compiler kmod wget
          
          # 安装 ARM64 和 ARM32 交叉编译器 (SM8350 编译必须)
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-sm8350-cache # 缓存的唯一标识
          max-size: 2G # 最大缓存 2GB，足够内核使用

      - name: Download Clang Toolchain
        run: |
          cd $GITHUB_WORKSPACE
          mkdir clang
          echo "正在下载 Clang r416183b (这可能需要 1-2 分钟)..."
          
          # 使用 curl -L 跟随重定向，这是下载 googlesource 文件的关键
          # 如果主链接失败，自动切换到备用链接
          curl -fSL --retry 5 --retry-connrefused --connect-timeout 30 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz" || \
          curl -fSL --retry 5 --retry-connrefused --connect-timeout 30 \
            -o clang.tar.gz \
            "https://gitlab.com/mvaisakh/prebuilts/-/raw/main/clang/host/linux-x86/clang-r416183b.tar.gz"
            
          if [ $? -ne 0 ] || [ ! -s clang.tar.gz ]; then
             echo "❌ Clang 下载失败！请检查网络连接。"
             exit 1
          fi
          
          echo "正在解压..."
          tar -C clang -xzf clang.tar.gz
          rm clang.tar.gz
          
          # 验证 clang 是否存在
          if [ -f "$GITHUB_WORKSPACE/clang/bin/clang" ]; then
             echo "✅ Clang 安装成功！"
             echo "CLANG_DIR=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV
          else
             echo "❌ Clang 二进制文件未找到！"
             exit 1
          fi
      - name: Compile Kernel
        run: |
          export PATH=$CLANG_DIR:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 启用 ccache 加速编译
          export PATH="/usr/lib/ccache:$PATH"

          echo "开始生成 defconfig..."
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- star_defconfig
          
          echo "开始编译内核 (使用 $(nproc) 核心)..."
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4 # 升级到 v4，解决报错
        if: success()
        with:
          name: Xiaomi-11-Ultra-Kernel
          path: out/arch/arm64/boot/Image
          retention-days: 7 # 产物保留 7 天，节省空间
