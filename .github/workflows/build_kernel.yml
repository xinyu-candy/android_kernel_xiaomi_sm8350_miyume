name: Build Kernel for Xiaomi 11 Ultra (Star)

on:
  workflow_dispatch: # 允许手动点击按钮触发编译
  push:
    branches:
      - main # 当推送到 main 分支时自动触发（可选）

jobs:
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 20.04 环境，兼容性最好，无法使用Ubuntu 20.04 环境

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          submodules: recursive # 必须递归拉取子模块（包含 KernelSU 等）

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            python3 python3-pip libxml2-utils bzip2 libbz2-dev \
            libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush \
            schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev \
            pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl \
            libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler kmod

      - name: Download Clang Toolchain
        run: |
          # 下载适合 SM8350 的 Clang 工具链 (这里使用 Google 官方预编译的 r416183b1，兼容性较好)
          cd $GITHUB_WORKSPACE
          mkdir clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b1.tar.gz
          tar -C clang -xzf clang-r416183b1.tar.gz
          export CLANG_DIR=$GITHUB_WORKSPACE/clang/bin

      - name: Compile Kernel
        run: |
          export PATH=$CLANG_DIR:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # 开始编译
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- star_defconfig
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc --all)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: Xiaomi-11-Ultra-Kernel
          path: out/arch/arm64/boot/Image
